# -----------------------------------------------------------------------------
# Perfil de pruebas
#
# H2 en memoria: cada ejecucion de la suite parte de un esquema limpio, creado
# por Flyway desde db/migration. Los datos NO persisten: se destruyen al cerrar
# la base de datos, que es justo lo que se quiere para aislar las pruebas.
# -----------------------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:ikernell-test;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# La semilla de desarrollo no debe ejecutarse en pruebas: cada prueba crea sus
# propios datos.
spring.profiles.active=test

# Las fotografias de las pruebas van a target/, que se limpia con mvn clean.
ikernell.fotografias.directorio=./target/test-fotografias
ikernell.fotografias.tamano-maximo-bytes=2097152
ikernell.fotografias.tipos-permitidos=image/jpeg,image/png
spring.servlet.multipart.max-file-size=4MB
spring.servlet.multipart.max-request-size=4MB

ikernell.archivo-plano.separador=;
ikernell.archivo-plano.codificacion=UTF-8
