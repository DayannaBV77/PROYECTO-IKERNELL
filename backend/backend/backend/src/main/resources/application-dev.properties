# -----------------------------------------------------------------------------
# Perfil de desarrollo
#
# H2 en modo archivo: los datos sobreviven al reinicio de la aplicacion. Se
# eligio archivo y no memoria porque con H2 en memoria el esquema y los datos
# se destruyen al cerrarse la ultima conexion, es decir, se pierde todo lo
# registrado cada vez que se para la aplicacion.
# -----------------------------------------------------------------------------
spring.datasource.url=jdbc:h2:file:./data/ikernell;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Coordinador inicial solo de desarrollo (vacio del catalogo, decision D-18).
# Estas credenciales no deben usarse fuera de desarrollo.
ikernell.semilla.coordinador.correo=coordinador@ikernell.com
ikernell.semilla.coordinador.password=Dev12345
