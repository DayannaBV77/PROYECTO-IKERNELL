# -----------------------------------------------------------------------------
# Perfil de desarrollo
#
# PostgreSQL local. Se dejo de usar H2 en archivo porque el esquema solo era
# inspeccionable desde la consola embebida de la propia aplicacion: con
# PostgreSQL las tablas, restricciones y datos se administran desde pgAdmin 4,
# que es la herramienta con la que se revisa el modelo relacional del Caso de
# Estudio ADSI 2017.
#
# NINGUNA credencial vive en este archivo: los valores salen de .env (ver
# spring.config.import en application.properties) y, si no existe, de los
# valores por omision de aqui, que solo sirven para que el proyecto arranque
# recien clonado. La contrasena NO tiene valor por omision a proposito: poner
# uno significaria que, al faltar .env, la aplicacion se conectaria igual con
# una clave de ejemplo y el error aparecia mucho despues.
#
# Sin .env el arranque aborta en el acto -gracias a
# hikari.initialization-fail-timeout- con
# 'FATAL: password authentication failed for user "ikernell"'. El mensaje
# apunta a la clave, no al archivo que falta: si lo ve, revise que exista .env
# (cp .env.example .env).
#
# El servidor corre en un contenedor local (ver docs/base-de-datos.md).
# -----------------------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://${IKERNELL_DB_HOST:localhost}:${IKERNELL_DB_PUERTO:5432}/${IKERNELL_DB_NOMBRE:ikernell}
spring.datasource.username=${IKERNELL_DB_USUARIO:ikernell}
spring.datasource.password=${IKERNELL_DB_PASSWORD}

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Coordinador inicial solo de desarrollo (vacio del catalogo, decision D-18).
# Estas credenciales no deben usarse fuera de desarrollo.
ikernell.semilla.coordinador.correo=coordinador@ikernell.com
ikernell.semilla.coordinador.password=Dev12345

# -----------------------------------------------------------------------------
# Registro detallado, solo en desarrollo
#
# show-sql ya imprime las sentencias, pero con '?' en lugar de los valores. Los
# dos niveles de abajo anaden los parametros reales y lo que devuelve cada
# consulta, que es lo que permite comprobar que se inserto EXACTAMENTE lo que
# se esperaba al probar contra PostgreSQL.
#
# NO activar fuera de desarrollo: el log pasaria a contener datos personales de
# los trabajadores (RF-001) y los hashes de contrasena.
# -----------------------------------------------------------------------------
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# Marca el inicio, la confirmacion y la reversion de cada transaccion. Es la
# forma de ver, al probar, si una operacion se confirmo o se deshizo.
logging.level.org.springframework.orm.jpa.JpaTransactionManager=DEBUG
logging.level.org.springframework.transaction.interceptor=TRACE
