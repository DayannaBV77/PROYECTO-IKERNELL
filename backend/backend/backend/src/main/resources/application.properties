spring.application.name=backend

# Perfil por defecto. Cambiar con --spring.profiles.active=...
spring.profiles.active=dev

# -----------------------------------------------------------------------------
# Esquema de base de datos
#
# Flyway es la unica fuente de verdad del esquema: las migraciones de
# db/migration son las que el Caso de Estudio ADSI 2017 pide documentar como
# modelo relacional. Hibernate solo valida que las entidades coincidan con el
# esquema y NUNCA lo genera ni lo altera.
# -----------------------------------------------------------------------------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# -----------------------------------------------------------------------------
# ADVERTENCIA SOBRE LA BASE DE DATOS
#
# H2 es provisional, solo para desarrollo y pruebas. El esquema no es definitivo
# y la base de datos de produccion queda sin decidir hasta validar los
# requisitos con la empresa.
# -----------------------------------------------------------------------------

# -----------------------------------------------------------------------------
# Fotografias de perfil (RF-002)
#
# PROPUESTA pendiente de validacion (D-11): RF-002 exige "un formato permitido"
# y "los limites tecnicos definidos para el aplicativo", pero ningun documento
# dice cuales son. Estos valores son provisionales y configurables.
# -----------------------------------------------------------------------------
ikernell.fotografias.directorio=./data/fotografias
ikernell.fotografias.tamano-maximo-bytes=2097152
ikernell.fotografias.tipos-permitidos=image/jpeg,image/png

# El limite del contenedor se deja algo por encima del de la aplicacion para que
# el rechazo lo produzca la validacion de negocio, con su mensaje explicativo,
# y no el servidor con un error generico.
spring.servlet.multipart.max-file-size=4MB
spring.servlet.multipart.max-request-size=4MB

# -----------------------------------------------------------------------------
# Correo electronico corporativo (RF-031)
#
# RF-031 admite que el correo sea externo al aplicativo y que el sistema solo
# proporcione "un acceso o enlace autorizado"; la integracion tecnica queda por
# confirmar con la empresa (D-13). Vacio significa servicio no disponible, y la
# API responde con el aviso de HU-20 C05.
# -----------------------------------------------------------------------------
ikernell.correo.url=
