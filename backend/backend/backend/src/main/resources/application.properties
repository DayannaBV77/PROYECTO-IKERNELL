spring.application.name=backend

# Perfil por defecto. Cambiar con --spring.profiles.active=...
spring.profiles.active=dev

# -----------------------------------------------------------------------------
# Credenciales: archivo .env
#
# 'optional:' significa que la aplicacion arranca aunque .env no exista, que es
# lo que necesita la suite de pruebas (usa H2 y no requiere credenciales).
#
# El sufijo [.properties] es obligatorio: sin el, Spring no sabe como leer un
# archivo cuya extension es '.env' y falla al arrancar.
# -----------------------------------------------------------------------------
spring.config.import=optional:file:./.env[.properties]

# -----------------------------------------------------------------------------
# Esquema de base de datos
#
# Flyway es la unica fuente de verdad del esquema: las migraciones de
# db/migration son las que el Caso de Estudio ADSI 2017 pide documentar como
# modelo relacional. Hibernate solo valida que las entidades coincidan con el
# esquema y NUNCA lo genera ni lo altera.
# -----------------------------------------------------------------------------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# -----------------------------------------------------------------------------
# Pool de conexiones (HikariCP)
#
# Por que un maximo tan bajo: PostgreSQL reserva memoria por conexion y la
# cuenta contra max_connections (100 por omision). Un pool pequeno y estable
# rinde mas que uno grande, porque el cuello de botella son los nucleos y los
# discos del servidor, no el numero de conexiones abiertas.
#
# leak-detection-threshold avisa en el log si una conexion lleva 20 s sin
# devolverse al pool. Es justo el sintoma de una transaccion que quedo abierta,
# el error que mas cuesta diagnosticar cuando las pruebas empiezan a colgarse.
# -----------------------------------------------------------------------------
spring.datasource.hikari.pool-name=IKernellPool
spring.datasource.hikari.maximum-pool-size=${IKERNELL_DB_POOL_MAXIMO:10}
spring.datasource.hikari.minimum-idle=${IKERNELL_DB_POOL_MINIMO:2}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=20000

# Falla al arrancar si la base de datos no responde, en lugar de aceptar
# peticiones que reventarian una por una con el mismo error de conexion.
spring.datasource.hikari.initialization-fail-timeout=10000

# -----------------------------------------------------------------------------
# ADVERTENCIA SOBRE LA BASE DE DATOS
#
# El motor es PostgreSQL (decision D-28): desarrollo corre contra un servidor
# local y el esquema se administra con pgAdmin 4. H2 queda reservado a la suite
# de pruebas, donde interesa un esquema en memoria que se destruye al terminar.
#
# El ESQUEMA sigue sin ser definitivo: las columnas y restricciones marcadas
# como PENDIENTE en db/migration esperan que la empresa defina sus dominios.
# Elegir el motor no cierra esas decisiones.
# -----------------------------------------------------------------------------

# -----------------------------------------------------------------------------
# Fotografias de perfil (RF-002)
#
# PROPUESTA pendiente de validacion (D-11): RF-002 exige "un formato permitido"
# y "los limites tecnicos definidos para el aplicativo", pero ningun documento
# dice cuales son. Estos valores son provisionales y configurables.
# -----------------------------------------------------------------------------
ikernell.fotografias.directorio=./data/fotografias
ikernell.fotografias.tamano-maximo-bytes=2097152
ikernell.fotografias.tipos-permitidos=image/jpeg,image/png

# El limite del contenedor se deja algo por encima del de la aplicacion para que
# el rechazo lo produzca la validacion de negocio, con su mensaje explicativo,
# y no el servidor con un error generico.
spring.servlet.multipart.max-file-size=4MB
spring.servlet.multipart.max-request-size=4MB

# -----------------------------------------------------------------------------
# Correo electronico corporativo (RF-031)
#
# RF-031 admite que el correo sea externo al aplicativo y que el sistema solo
# proporcione "un acceso o enlace autorizado"; la integracion tecnica queda por
# confirmar con la empresa (D-13). Vacio significa servicio no disponible, y la
# API responde con el aviso de HU-20 C05.
# -----------------------------------------------------------------------------
ikernell.correo.url=${IKERNELL_CORREO_URL:}
ikernell.correo.dominio=${IKERNELL_CORREO_DOMINIO:ikernell.com}

# -----------------------------------------------------------------------------
# Registro (logging)
#
# Dos destinos con dos propositos distintos:
#   - CONSOLA: el detalle para depurar (SQL, parametros, transacciones, pool).
#   - TABLA registro_operacion: la trazabilidad que sobrevive al reinicio
#     (RNF-003), escrita por FiltroRegistroOperaciones.
#
# 'ikernell.auditoria' es el logger del filtro: una linea por operacion, con
# metodo, ruta, codigo, duracion y quien la ejecuto. Para seguir solo esas:
#   ./mvnw spring-boot:run | grep ikernell.auditoria
# -----------------------------------------------------------------------------
logging.level.ikernell.auditoria=INFO
logging.level.com.PROYECTO.IKERNELL.backend=INFO

# Flyway: deja constancia de que migracion aplico y en que version quedo el
# esquema, que es lo primero que se mira cuando una tabla "no existe".
logging.level.org.flywaydb=INFO

# Hikari en INFO anuncia el arranque del pool y su tamano. Subirlo a DEBUG
# muestra cada prestamo y devolucion de conexion: util para perseguir fugas,
# ensordecedor para todo lo demas.
logging.level.com.zaxxer.hikari=INFO

logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n

# -----------------------------------------------------------------------------
# Reporte externo para la empresa brasileña aliada (RF-025, HU-19)
#
# PROPUESTA pendiente de acuerdo (D-28, D-41): HU-19 C02 exige "los campos, el
# separador y la codificacion definidos", pero T1 y T2 dejan ese acuerdo
# pendiente con la empresa brasileña. Todo lo que el acuerdo puede cambiar vive
# aqui para que cerrarlo no obligue a tocar codigo.
#
# formatos: DELIMITADO, CSV, ANCHO_FIJO, TXT
#   - DELIMITADO usa 'separador' y no entrecomilla.
#   - CSV usa 'separador' con comillas y escape RFC 4180; si la empresa pide
#     coma, cambiar separador=,
#   - ANCHO_FIJO usa los anchos declarados mas abajo.
#   - TXT escribe bloques legibles de "campo: valor".
#
# fin-de-linea: valor literal. '\n' es salto de linea; usar '\r\n' para CRLF.
# -----------------------------------------------------------------------------
ikernell.reporte-externo.formato=DELIMITADO
ikernell.reporte-externo.separador=|
ikernell.reporte-externo.codificacion=UTF-8
ikernell.reporte-externo.incluir-cabecera=true
ikernell.reporte-externo.nombre-base=ikernell-reporte-externo
ikernell.reporte-externo.fin-de-linea=\n

# Campos y su orden. Solo se admiten los que MapeadorReporteExterno sabe
# resolver; una errata detiene el arranque en lugar de producir columnas vacias.
ikernell.reporte-externo.campos=proyecto_id,proyecto_nombre,estado_habilitacion,estado_operativo,fecha_inicio_real,fecha_fin_real,etapas_registradas,actividades_registradas,ejecuciones_registradas,ejecuciones_finalizadas,errores_registrados,interrupciones_registradas,primera_ejecucion,ultima_ejecucion

# Anchos del formato ANCHO_FIJO. Los campos sin ancho usan 24 caracteres.
ikernell.reporte-externo.anchos.proyecto_id=10
ikernell.reporte-externo.anchos.proyecto_nombre=40
ikernell.reporte-externo.anchos.estado_habilitacion=18
ikernell.reporte-externo.anchos.estado_operativo=16
ikernell.reporte-externo.anchos.fecha_inicio_real=12
ikernell.reporte-externo.anchos.fecha_fin_real=12
ikernell.reporte-externo.anchos.etapas_registradas=10
ikernell.reporte-externo.anchos.actividades_registradas=14
ikernell.reporte-externo.anchos.ejecuciones_registradas=14
ikernell.reporte-externo.anchos.ejecuciones_finalizadas=14
ikernell.reporte-externo.anchos.errores_registrados=12
ikernell.reporte-externo.anchos.interrupciones_registradas=16
ikernell.reporte-externo.anchos.primera_ejecucion=20
ikernell.reporte-externo.anchos.ultima_ejecucion=20
